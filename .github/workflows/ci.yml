name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: lint / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Catches the failure mode that has bitten this repo repeatedly: HTML and
      # the web manifest referencing icon files that were never committed.
      - name: Verify referenced static assets exist
        run: |
          missing=0
          for f in \
            public/favicon.ico \
            public/icons/icon-32.png \
            public/icons/icon-180.png \
            public/icons/icon-192.png \
            public/icons/icon-512.png \
            public/icons/icon-maskable-512.png \
            public/icons/icon-1024.png
          do
            if [ ! -f "$f" ]; then echo "MISSING: $f"; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Referenced static assets are missing. See index.html and public/manifest.json."
            exit 1
          fi
          echo "All referenced static assets present."
